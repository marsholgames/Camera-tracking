<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mocap كاميرا</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--tx:#f2f4f8;--ac:#00e5a0;--rd:#ff4d5e}
@media (prefers-color-scheme: light){:root{--bg:#eef1f5;--card:#fff;--tx:#14171c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:auto;padding:10px}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mir{transform:scaleX(-1)}
#st{position:absolute;top:8px;right:8px;background:#000a;color:#fff;padding:4px 10px;border-radius:20px;font-size:13px}
.rec{background:var(--rd)!important;color:#fff!important}
.row{display:flex;gap:8px;margin-top:10px}
button{flex:1;padding:14px 6px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font-size:16px;font-weight:600}
button.p{background:var(--ac);color:#003d2b}
button:disabled{opacity:.4}
.card{background:var(--card);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
input[type=range]{width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <video id="v" playsinline muted class="mir"></video>
    <canvas id="c" class="mir"></canvas>
    <div id="st">اضغط تشغيل الكاميرا</div>
  </div>
  <div class="row">
    <button class="p" id="start">تشغيل الكاميرا</button>
    <button id="flip" disabled>قلب الكاميرا</button>
  </div>
  <div class="row">
    <button id="rec" disabled>● تسجيل</button>
    <button id="play" disabled>▶ معاينة</button>
  </div>
  <div class="card">
    كل كام فريم نسجل Keyframe: <b id="kv">1</b>
    <input type="range" id="kf" min="1" max="10" value="1">
    <div id="info">لسه مفيش تسجيل</div>
  </div>
  <div class="row">
    <button id="json" disabled>تصدير JSON</button>
    <button id="bvh" disabled>تصدير CSV</button>
  </div>
  <div class="row">
    <button id="ms" class="p" disabled>تصدير 3ds Max (.ms)</button>
  </div>
</div>

<script type="module">
import {PoseLandmarker,HandLandmarker,FilesetResolver,DrawingUtils} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";
const $=id=>document.getElementById(id);
const v=$('v'),c=$('c'),ctx=c.getContext('2d'),st=$('st');
const POSE=["nose","l_eye_in","l_eye","l_eye_out","r_eye_in","r_eye","r_eye_out","l_ear","r_ear","mouth_l","mouth_r","l_shoulder","r_shoulder","l_elbow","r_elbow","l_wrist","r_wrist","l_pinky","r_pinky","l_index","r_index","l_thumb","r_thumb","l_hip","r_hip","l_knee","r_knee","l_ankle","r_ankle","l_heel","r_heel","l_foot","r_foot"];
let pose,hand,facing='user',stream,recording=false,frames=[],t0=0,cnt=0,last=-1,playing=false;

$('kf').oninput=e=>$('kv').textContent=e.target.value;

async function loadModels(){
  st.textContent='بحمّل الموديلات…';
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const base="https://storage.googleapis.com/mediapipe-models/";
  pose=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:base+"pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},runningMode:"VIDEO",numPoses:1});
  hand=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:base+"hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numHands:2});
}
async function cam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:960},height:{ideal:1280}},audio:false});
  v.srcObject=stream;await v.play();
  c.width=v.videoWidth;c.height=v.videoHeight;
  v.classList.toggle('mir',facing==='user');c.classList.toggle('mir',facing==='user');
}
$('start').onclick=async()=>{
  try{
    $('start').disabled=true;
    if(!pose)await loadModels();
    await cam();
    $('rec').disabled=false;$('flip').disabled=false;
    st.textContent='التتبع شغال';
    loop();
  }catch(e){st.textContent='خطأ: '+e.message;$('start').disabled=false}
};
$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';await cam()};

$('rec').onclick=()=>{
  if(!recording){frames=[];cnt=0;t0=performance.now();recording=true;$('rec').textContent='■ إيقاف';$('rec').classList.add('rec');$('play').disabled=true;}
  else{recording=false;$('rec').textContent='● تسجيل';$('rec').classList.remove('rec');
    const ok=frames.length>0;['play','json','bvh','ms'].forEach(i=>$(i).disabled=!ok);
    $('info').textContent=`اتسجل ${frames.length} keyframe — ${(frames.length?frames[frames.length-1].t:0).toFixed(1)} ثانية`;}
};

function loop(){
  if(!playing){
    const now=performance.now();
    if(v.currentTime!==last&&v.videoWidth){
      last=v.currentTime;
      const p=pose.detectForVideo(v,now),h=hand.detectForVideo(v,now);
      ctx.clearRect(0,0,c.width,c.height);
      draw(p.landmarks[0],h.landmarks,h.handednesses);
      if(recording){
        if(cnt++%$('kf').value==0){
          const H={};
          h.landmarks.forEach((l,i)=>{H[h.handednesses[i][0].categoryName]=l.map(q=>[q.x,q.y,q.z])});
          frames.push({t:(now-t0)/1000,pose:p.landmarks[0]?p.landmarks[0].map(q=>[q.x,q.y,q.z]):null,hands:H});
        }
        st.textContent='● REC '+frames.length;
      }
    }
  }
  requestAnimationFrame(loop);
}
function draw(pl,hl){
  const d=new DrawingUtils(ctx);
  if(pl){d.drawConnectors(pl,PoseLandmarker.POSE_CONNECTIONS,{color:'#00e5a0',lineWidth:3});d.drawLandmarks(pl,{color:'#fff',fillColor:'#ff4d5e',radius:4});}
  (hl||[]).forEach(l=>{d.drawConnectors(l,HandLandmarker.HAND_CONNECTIONS,{color:'#ffd400',lineWidth:2});d.drawLandmarks(l,{color:'#fff',fillColor:'#00b4ff',radius:3});});
}
$('play').onclick=()=>{
  if(playing||!frames.length)return;playing=true;const s=performance.now();let i=0;
  const d=new DrawingUtils(ctx);
  (function step(){
    const t=(performance.now()-s)/1000;
    while(i<frames.length-1&&frames[i+1].t<=t)i++;
    ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
    const f=frames[i];
    if(f.pose){const L=f.pose.map(q=>({x:q[0],y:q[1],z:q[2]}));d.drawConnectors(L,PoseLandmarker.POSE_CONNECTIONS,{color:'#00e5a0',lineWidth:3});d.drawLandmarks(L,{fillColor:'#ff4d5e',radius:4});}
    Object.values(f.hands).forEach(h=>{const L=h.map(q=>({x:q[0],y:q[1],z:q[2]}));d.drawConnectors(L,HandLandmarker.HAND_CONNECTIONS,{color:'#ffd400'});d.drawLandmarks(L,{fillColor:'#00b4ff',radius:3});});
    if(t<frames[frames.length-1].t)requestAnimationFrame(step);else playing=false;
  })();
};

function save(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();}
$('json').onclick=()=>{
  // tracks: لكل مفصل قائمة keyframes {t,x,y,z}
  const tracks={};
  const add=(k,t,q)=>{(tracks[k]??=[]).push({t:+t.toFixed(3),x:q[0],y:q[1],z:q[2]})};
  frames.forEach(f=>{
    if(f.pose)f.pose.forEach((q,i)=>add('body.'+POSE[i],f.t,q));
    for(const s in f.hands)f.hands[s].forEach((q,i)=>add('hand_'+s+'.'+i,f.t,q));
  });
  save('mocap.json',JSON.stringify({fps_sampling:+$('kf').value,duration:frames.at(-1).t,tracks},null,1),'application/json');
};
$('ms').onclick=()=>{
  const FPS=30,S=170; // S = حجم الجسم تقريبًا بوحدات Max (سم)
  const tr={};
  const add=(k,t,q)=>{(tr[k]??=[]).push([Math.round(t*FPS),(q[0]-0.5)*S,q[2]*S,(0.5-q[1])*S])};
  frames.forEach(f=>{
    if(f.pose){f.pose.forEach((q,i)=>add('body_'+POSE[i],f.t,q));
      const mid=(a,b)=>[0,1,2].map(k=>(f.pose[a][k]+f.pose[b][k])/2);
      add('mid_hip',f.t,mid(23,24));add('mid_shoulder',f.t,mid(11,12));}
    for(const s in f.hands)f.hands[s].forEach((q,i)=>add('hand_'+s+'_'+i,f.t,q));
  });
  let o=`-- Mocap import for 3ds Max\nframeRate=${FPS}\nanimationRange=interval 0 ${Math.round(frames.at(-1).t*FPS)}\ngrp=#()\n`;
  for(const k in tr){
    o+=`p=Point name:"${k}" box:true cross:false size:3\nappend grp p\nanimate on (\n`;
    tr[k].forEach(a=>{o+=`at time ${a[0]} p.pos=[${a[1].toFixed(2)},${a[2].toFixed(2)},${a[3].toFixed(2)}]\n`});
    o+=`)\n`;
  }
  // ===== ربط العظام العادية (Bones) =====
  const M=[["mid_hip","mid_shoulder","Spine",1],["mid_shoulder","body_nose","Head",0],
   ["body_l_shoulder","body_l_elbow","UpperArm_L",0],["body_l_elbow","body_l_wrist","Forearm_L",0],["body_l_wrist","body_l_index","Hand_L",0],
   ["body_r_shoulder","body_r_elbow","UpperArm_R",0],["body_r_elbow","body_r_wrist","Forearm_R",0],["body_r_wrist","body_r_index","Hand_R",0],
   ["body_l_hip","body_l_knee","Thigh_L",0],["body_l_knee","body_l_ankle","Calf_L",0],["body_l_ankle","body_l_foot","Foot_L",0],
   ["body_r_hip","body_r_knee","Thigh_R",0],["body_r_knee","body_r_ankle","Calf_R",0],["body_r_ankle","body_r_foot","Foot_R",0]];
  o+=`\n-- >>> غيّر الاسم التالت في كل سطر لاسم العظمة عندك. الرابع 1 = العظمة تتبع مكان النقطة (للجذر بس)\nboneMap=#(\n`;
  o+=M.map(m=>`#("${m[0]}","${m[1]}","${m[2]}",${m[3]})`).join(',\n')+`\n)\n`;
  o+=`for m in boneMap do (\n b=getNodeByName m[3]; t=getNodeByName m[2]; s=getNodeByName m[1]\n if b!=undefined and s!=undefined and t!=undefined do (\n  if m[4]==1 do (pc=Position_Constraint(); b.pos.controller=pc; pc.constraints.appendTarget (getNodeByName m[1]) 100)\n  lc=LookAt_Constraint(); b.rotation.controller=lc; lc.constraints.appendTarget t 100\n  lc.target_axis=0; lc.upnode_world=true\n )\n)\n`;
  o=o.replace('grp=#()\n','grp=#()\n');
  o+=`select grp\nmax tool zoomextents all\nsliderTime=0\n`;
  save('mocap_import.ms',o,'text/plain');
};
$('bvh').onclick=()=>{
  const rows=['time,joint,x,y,z'];
  frames.forEach(f=>{
    if(f.pose)f.pose.forEach((q,i)=>rows.push([f.t.toFixed(3),'body.'+POSE[i],...q].join(',')));
    for(const s in f.hands)f.hands[s].forEach((q,i)=>rows.push([f.t.toFixed(3),`hand_${s}.${i}`,...q].join(',')));
  });
  save('mocap.csv',rows.join('\n'),'text/csv');
};
</script>
</body>
</html>
